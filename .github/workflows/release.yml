name: Release image

on:
  push:
    tags: ["v*"]
  # Manual run = dry run: builds all architectures without publishing.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      # Publish only on a real tag push. A manual run stays a dry run even
      # when started on a tag ref (github.ref is refs/tags/... there too).
      PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/lobbyshift
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ env.PUBLISH == 'true' }}
            type=ref,event=branch
      - uses: docker/build-push-action@v7
        with:
          context: .
          # amd64 servers, 64-bit and 32-bit Raspberry Pi
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
