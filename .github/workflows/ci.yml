name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: pytest -q

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install.sh uninstall.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: lobbyshift:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: docker run --rm lobbyshift:ci --version
      - name: Integration test (real kernel, isolated network namespace)
        run: |
          docker run -d --name ls --cap-drop ALL --cap-add NET_ADMIN --cap-add NET_RAW \
            --read-only --tmpfs /tmp \
            -e LOBBYSHIFT_ADMIN_PASSWORD=integration-test \
            -e LOBBYSHIFT_GEOIP_AUTO_UPDATE=false \
            lobbyshift:ci
          docker exec -i ls python - < scripts/integration_check.py
      - name: Container logs
        if: always()
        run: docker logs ls 2>&1 | tail -50 || true
